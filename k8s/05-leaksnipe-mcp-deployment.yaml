# ── 05-leaksnipe-mcp-deployment.yaml ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaksnipe-mcp-server
  namespace: default
  labels:
    app: leaksnipe-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaksnipe-mcp
  template:
    metadata:
      labels:
        app: leaksnipe-mcp
    spec:
      containers:
        - name: leaksnipe-mcp
          image: node:20-alpine
          command:
            - "sh"
            - "-c"
            - |
              cat << 'EOF' > /app/server.js
              const http = require('http');
              const https = require('https');
              const PORT = process.env.PORT || 3000;
              const server = http.createServer((req, res) => {
                res.setHeader('Content-Type', 'application/json');
                res.setHeader('Access-Control-Allow-Origin', '*');
                if (req.url === '/health' || req.url === '/api/status') {
                  res.writeHead(200);
                  return res.end(JSON.stringify({
                    success: true,
                    service: 'leaksnipe-k8s-mcp',
                    target: 'https://mcp.leaksnipe.win',
                    status: 'online',
                    timestamp: new Date().toISOString()
                  }));
                }
                // Relay / proxy to edge Cloudflare worker
                const proxyReq = https.request('https://mcp.leaksnipe.win' + req.url, {
                  method: req.method,
                  headers: req.headers
                }, (pRes) => {
                  res.writeHead(pRes.statusCode, pRes.headers);
                  pRes.pipe(res);
                });
                req.pipe(proxyReq);
              });
              server.listen(PORT, '0.0.0.0', () => console.log('LeakSnipe MCP active on :' + PORT));
              EOF
              node /app/server.js
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: leaksnipe-mcp
  namespace: default
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "leaksnipe-mcp"
    tailscale.com/tags: "tag:core"
spec:
  type: ClusterIP
  selector:
    app: leaksnipe-mcp
  ports:
    - name: https
      port: 443
      targetPort: 3000
