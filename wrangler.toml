name = "hypedog"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat_v2", "transformstream_enable_standard_constructor"]

[assets]
directory = "./dist/public"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "truffle"
database_name = "scalper-calibration"
database_id = "48536b22-03b3-42dd-92fa-44feab144d84"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

