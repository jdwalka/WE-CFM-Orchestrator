apiVersion: apps/v1
kind: Deployment
metadata:
  name: wecrypto-execution-engine
  namespace: wecrypto
  labels:
    app: wecrypto-sniper
spec:
  replicas: 1 # Exactly one instance to avoid race conditions and double fills
  selector:
    matchLabels:
      app: wecrypto-sniper
  template:
    metadata:
      labels:
        app: wecrypto-sniper
    spec:
      containers:
      - name: sniper-bot
        image: walkerenterprise/we-cfm-orchestrator:latest
        command: ["python3", "engines/sniper_execution.py"]
        env:
        - name: KAFKA_BROKER
          value: "redpanda:29092" # Maps to the internal Redpanda broker network address
        - name: TRIGGER_TOPIC
          value: "whale-alerts"
        - name: KALSHI_WS_URL
          value: "wss://api.elections.kalshi.com/trade-api/v2/ws"
        - name: KALSHI_API_KEY_ID
          valueFrom:
            secretKeyRef:
              name: kalshi-credentials
              key: api-key-id
        - name: KALSHI_PRIVATE_KEY_PEM
          valueFrom:
            secretKeyRef:
              name: kalshi-credentials
              key: private-key-pem
        resources:
          requests:
            memory: "1Gi"
            cpu: "2" # Dedicated CPU cores for low-latency thread context-switching
          limits:
            memory: "1Gi"
            cpu: "2" # Guaranteed QoS
      priorityClassName: system-cluster-critical # Prevent scheduling eviction
