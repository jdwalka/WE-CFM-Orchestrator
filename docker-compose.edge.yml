# Edge executor profile: Kalshi WS + DQN inference co-located in us-east-1.
# Run ONLY on the edge VPS, never on the brain. WireGuard peers the brain in.
# The brain pushes weight snapshots and Sig_prob floats; the edge never
# initiates an inbound connection back.
#
# Usage:
#   EDGE_REDIS_PASSWORD= \
#   BRAIN_SYNC_URL=http://10.10.0.1:3443 \
#   WECRYPTO_CLOUD_DATA_PATH=./data \
#   docker compose -f docker-compose.edge.yml up -d

version: "3.8"

services:
  # In-memory broker. No disk I/O, no persistence — edge is stateless
  # aside from the model cache volume. Bound to 127.0.0.1 inside the
  # edge bridge so only co-resident containers can reach it.
  redis-broker:
    image: redis:7-alpine
    container_name: wecrypto-edge-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - "30"
      - --protected-mode
      - "yes"
      - --bind
      - 127.0.0.1
      - --requirepass
      - ""
    expose:
      - "6379"
    networks:
      - edge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The Kalshi shell: WS connection + DQN inference + order placement.
  # No host-exposed ports — only the edge-redis sidecar is reachable.
  kalshi-shell:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: wecrypto-kalshi-shell
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:@127.0.0.1:6379
      - WECRYPTO_EDGE_MODE=1
      - KALSHI_EDGE_INFERENCE=1
      - KALSHI_WS_URL=
      - KALSHI_API_KEY_ID_FILE=/run/secrets/kalshi_api_key_id
      - KALSHI_PRIVATE_KEY_PEM_FILE=/run/secrets/kalshi_private_key_pem
    secrets:
      - kalshi_api_key_id
      - kalshi_private_key_pem
    volumes:
      - /edge:/app/data
      - edge_model_cache:/app/.cache
    depends_on:
      redis-broker:
        condition: service_healthy
    networks:
      - edge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Weight sync daemon: pulls model + Sig_prob snapshots from the brain
  # over WireGuard. One-way pull, never pushes back.
  weight-sync:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: wecrypto-weight-sync
    command: ["node", "tools/edge-weight-sync.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:@127.0.0.1:6379
      - BRAIN_SYNC_URL=
      - BRAIN_SYNC_TOKEN_FILE=/run/secrets/brain_sync_token
      - EDGE_WEIGHT_POLL_MS=2000
    secrets:
      - brain_sync_token
    depends_on:
      redis-broker:
        condition: service_healthy
    networks:
      - edge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

secrets:
  kalshi_api_key_id:
    file: ./secrets/kalshi_api_key_id
  kalshi_private_key_pem:
    file: ./secrets/kalshi_private_key_pem
  brain_sync_token:
    file: ./secrets/brain_sync_token

volumes:
  edge_model_cache:
    driver: local

networks:
  edge-net:
    driver: bridge
