name = "wecryp-hub"
main = "src/index.js"
compatibility_date = "2026-09-10"

routes = [
  { pattern = "hub.leaksnipe.win/*", zone_name = "leaksnipe.win" }
]

workers_dev = true
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
