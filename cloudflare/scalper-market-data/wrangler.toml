name = "scalper-market-data"
main = "src/index.js"
compatibility_date = "2026-09-10"

# D1 bindings for calibration persistence and health checks.
[[d1_databases]]
binding = "CALIBRATION_DB"
database_name = "scalper-calibration"
database_id = "48536b22-03b3-42dd-92fa-44feab144d84"

[[d1_databases]]
binding = "truffle"
database_name = "scalper-calibration"
database_id = "48536b22-03b3-42dd-92fa-44feab144d84"

routes = [
  { pattern = "scalper.leaksnipe.win", custom_domain = true },
  { pattern = "scalper.leaksnipe.win/*", zone_name = "leaksnipe.win" }
]

workers_dev = true
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
