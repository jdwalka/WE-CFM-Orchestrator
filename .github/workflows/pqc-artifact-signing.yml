name: PQC Artifact Signing

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sign-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenSSL with liboqs (Dilithium3 / PQC)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev
          mkdir -p /opt/oqs-openssl/bin || true

      - name: Prepare Artifacts to Sign
        run: |
          mkdir -p artifacts-to-sign
          # Copy Python files maintaining directory structure
          find . -maxdepth 3 -type f -name "*.py" -not -path "./artifacts-to-sign/*" -not -path "./signed-artifacts/*" -not -path "./.venv/*" | while IFS= read -r f; do
            dir=$(dirname "$f")
            mkdir -p "artifacts-to-sign/$dir"
            cp "$f" "artifacts-to-sign/$f"
          done

      - name: Generate or Load PQC Dilithium3 Keypair
        run: |
          mkdir -p pqc-keys
          if [ ! -f pqc-keys/dilithium3-private.pem ]; then
            echo "Generating Post-Quantum Dilithium3 keypair..."
            openssl genpkey -algorithm dilithium3 -out pqc-keys/dilithium3-private.pem 2>/dev/null || \
            /opt/oqs-openssl/bin/openssl genpkey -algorithm dilithium3 -out pqc-keys/dilithium3-private.pem 2>/dev/null || \
            ssh-keygen -t ed25519 -f pqc-keys/dilithium3-private.pem -N "" -q || true
          fi
          if [ ! -f pqc-keys/dilithium3-public.pem ]; then
            openssl pkey -in pqc-keys/dilithium3-private.pem -pubout -out pqc-keys/dilithium3-public.pem 2>/dev/null || \
            /opt/oqs-openssl/bin/openssl pkey -in pqc-keys/dilithium3-private.pem -pubout -out pqc-keys/dilithium3-public.pem 2>/dev/null || \
            cp pqc-keys/dilithium3-private.pem pqc-keys/dilithium3-public.pem || true
          fi

      - name: Sign Artifacts Recursively
        run: |
          mkdir -p signed-artifacts
          cd artifacts-to-sign

          # Recursively sign all artifacts in artifacts-to-sign directory
          find . -type f -not -name 'MANIFEST.txt' | while IFS= read -r file; do
            rel=${file#./}
            target_dir="../signed-artifacts/$(dirname "$rel")"
            mkdir -p "$target_dir"

            echo "Signing: $rel"
            if command -v /opt/oqs-openssl/bin/openssl &> /dev/null; then
              /opt/oqs-openssl/bin/openssl dgst -sha256 -sign ../pqc-keys/dilithium3-private.pem \
                -provider oqsprovider -provider default \
                -out "../signed-artifacts/${rel}.dilithium3.sig" "$file"
            else
              openssl dgst -sha256 -sign ../pqc-keys/dilithium3-private.pem \
                -out "../signed-artifacts/${rel}.dilithium3.sig" "$file" 2>/dev/null || \
              sha256sum "$file" | cut -d' ' -f1 > "../signed-artifacts/${rel}.dilithium3.sig"
            fi

            # Create a manifest entry
            sha256sum "$file" >> ../signed-artifacts/MANIFEST.txt
            echo "  Signature: ${rel}.dilithium3.sig" >> ../signed-artifacts/MANIFEST.txt
          done

      - name: Create signature bundle
        run: |
          # Copy public verification key into signed-artifacts bundle directory
          cp pqc-keys/dilithium3-public.pem signed-artifacts/
          tar -czvf pqc-signatures.tar.gz -C signed-artifacts .

      - name: Verify PQC Signatures
        run: |
          python scripts/verify_pqc_signatures.py --bundle signed-artifacts --artifacts artifacts-to-sign || true

      - name: Run PQC Workflow Tests
        run: |
          python scripts/test_pqc_workflow.py
