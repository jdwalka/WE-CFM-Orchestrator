name: Sourcery AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(github.event.comment.body, '@sourcery-ai')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sourcery Review Action
        uses: sourcery-ai/action@v1
        continue-on-error: true
        env:
          SOURCERY_TOKEN: ${{ secrets.SOURCERY_TOKEN }}
        with:
          token: ${{ secrets.SOURCERY_TOKEN }}

