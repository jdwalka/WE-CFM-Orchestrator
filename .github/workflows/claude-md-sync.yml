name: Sync CLAUDE.md

# Pulls CLAUDE.md from the canonical upstream repo and opens a PR when it drifts.
# REQUIRED: set `source-repo` below to the real upstream (owner/repo).

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync CLAUDE.md
        uses: EtK2000/CLAUDE.md-sync@v1
        with:
          source-repo: JohnDaWalka/WE-CFM-Orchestrator # TODO: confirm canonical upstream
          source-ref: main
          source-path: CLAUDE.md
          target-path: CLAUDE.md
          token: ${{ github.token }}
