name: Claude Bots

# Aggregates the Claude-powered review / autofix actions.
#
# REQUIRED BEFORE THIS WORKS (see PR description):
#   1. Repo secret  ANTHROPIC_API_KEY   (Settings > Secrets and variables > Actions)
#      - or, for the two official anthropics/* actions, CLAUDE_CODE_OAUTH_TOKEN
#        from `claude setup-token` if you're on a Max/Pro subscription.
#   2. Install the "Claude" GitHub App on this repo so anthropics/claude-code-action
#      can post comments / open PRs:  https://github.com/apps/claude
#   3. Nothing to install for enriconunes/claude-autofix-action or
#      rekpero/claude-bugbot-github-action beyond the API key.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-bots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap static validators for the repo's .claude/ config. No API key needed.
  claude-config-lint:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: claude-commands-check
        uses: MukundaKatta/claude-commands-check@v0.1.0
        with:
          paths: .claude/commands
      - name: claude-hooks-check
        uses: MukundaKatta/claude-hooks-check@v0.1.0
        with:
          paths: .claude/hooks
      - name: claude-skill-check
        uses: MukundaKatta/claude-skill-check@v0.1.0
        with:
          paths: .claude/skills

  # Official Anthropic action. Runs as a PR reviewer on PR events, and responds
  # to "@claude ..." mentions in issue / PR / review comments.
  claude-code:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # use instead of api key on Max/Pro

  # Lower-level building block. Only useful with an explicit prompt, so it is
  # gated to manual runs; edit the prompt for whatever one-off automation you need.
  claude-code-base:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude Code Base Action
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review the latest changes on this branch for correctness bugs and summarise anything risky."

  # Third-party PR review bot.
  bugbot:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude BugBot
        uses: rekpero/claude-bugbot-github-action@v1.0.14
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          model: sonnet
          max-budget: "1.00"

  # Third-party PR reviewer. Reads .ai-reviewer.yml at repo root if present.
  ai-pr-reviewer:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude PR Auditor
        uses: LennardGeissler/ai-pr-reviewer@v0.1.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}

  # Third-party PR reviewer. NOTE: input names below are assumed (action.yml not
  # verified) -- confirm against https://github.com/mjthinkkits/claude-pr-review
  claude-pr-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude PR Review
        uses: mjthinkkits/claude-pr-review@v1.0.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}

  # Third-party: runs the test suite, has Claude fix failures, opens a PR with the fix.
  autofix:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude AutoFix
        uses: enriconunes/claude-autofix-action@v2.1.2
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          language: javascript
          test-framework: jest
          create-pr: "true"
          max-fixes: "5"

  # Third-party: applies changes on PRs labelled "claudecoder". Uses AWS Bedrock,
  # NOT the Anthropic API -- needs AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets.
  claudecoder:
    if: >-
      github.event_name == 'pull_request' &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'claudecoder')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ClaudeCoderAction
        uses: EndemicMedia/claudecoder@v2.1.0
        with:
          github-token: ${{ github.token }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

  # Third-party: Claude PR reviewer bot using Bedrock. Requires AWS credentials.
  claude-code-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude AI Code Review
        uses: chimaek/claude-code-review-action@v1.0.2
        with:
          github-token: ${{ github.token }}

  # Third-party: Claude self-learning review bot (tracks patterns across PRs).
  claude-learn:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude Self-Learning Review
        uses: Valmarelox/claude-learn-action@v1.1.1
        with:
          github-token: ${{ github.token }}

  # Third-party: Claude code session tracking bot.
  claude-session:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude Code session
        uses: CVector-Energy/claude-code-session@v0.1.1
        with:
          github-token: ${{ github.token }}

  # Third-party: Setup Claude Code in the runner environment.
  setup-claude:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        uses: pleaseai/setup-claude-code@v1.1.4
