name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret is missing. Skipping mirror."
            exit 0
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/walkershooligans/wecrypto.git" || true
          git push gitlab --all --force
          git push gitlab --tags --force
