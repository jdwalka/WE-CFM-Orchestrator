                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass https://hermes.pyth.network/;
            proxy_set_header Host hermes.pyth.network;
            proxy_set_header Authorization "Bearer 9AowRQwEELKpsMosei146CTHcxeNoHuSUWuDhGfFxkXZ";
            proxy_ssl_server_name on;
            
            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # ---------------------------------------------------------
        # 10. Redpanda Admin API Route
        # App Request: http://localhost:8080/redpanda/...
        # ---------------------------------------------------------
        location /redpanda/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://host.docker.internal:9644/;
            proxy_set_header Host $host;
            
            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # ---------------------------------------------------------
        # 11. Redpanda Console API Route
        # App Request: http://localhost:8080/redpanda-console/...
        # ---------------------------------------------------------
        location /redpanda-console/ {
            if ($request_method = 'OPTIONS') {
