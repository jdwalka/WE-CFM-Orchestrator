worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name localhost;

        # ---------------------------------------------------------
        # 1. Kalshi API Route
        # App Request: http://localhost:8080/kalshi/...
        # ---------------------------------------------------------
        location /kalshi/ {
            # Handle CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Proxy to Kalshi
            proxy_pass https://trading-api.kalshi.com/;
            proxy_set_header Host trading-api.kalshi.com;
            proxy_ssl_server_name on;

            # Hide upstream CORS headers to prevent duplicates
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';

            # Inject permissive CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # ---------------------------------------------------------
        # 2. CoinGecko API Route 
        # App Request: http://localhost:8080/coingecko/...
        # ---------------------------------------------------------
        location /coingecko/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass https://api.coingecko.com/;
            proxy_set_header Host api.coingecko.com;
            proxy_ssl_server_name on;
            
            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # ---------------------------------------------------------
        # 3. Coinbase API Route
        # App Request: http://localhost:8080/coinbase/...
        # ---------------------------------------------------------
        location /coinbase/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass https://api.coinbase.com/;
            proxy_set_header Host api.coinbase.com;
            proxy_ssl_server_name on;
            
            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' '*' always;
        }
    }
}
