worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name localhost;

        # ---------------------------------------------------------
        # 0. Health check endpoint for proxy discovery
        # ---------------------------------------------------------
        location /health {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Content-Type' 'text/plain';
            return 200 'OK\n';
        }

        # ---------------------------------------------------------
        # 1. Polymarket Gamma API Route
        # App Request: http://localhost:8080/gamma/... or /polymarket/...
        # ---------------------------------------------------------
        location /gamma/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, POLY_API_KEY, POLY_PASSPHRASE, POLY_SIGNATURE, POLY_TIMESTAMP, POLY_ADDRESS, POLY_BUILDER_API_KEY' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass https://gamma-api.polymarket.com/;
            proxy_set_header Host gamma-api.polymarket.com;
            proxy_ssl_server_name on;

            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        location /polymarket/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, POLY_API_KEY, POLY_PASSPHRASE, POLY_SIGNATURE, POLY_TIMESTAMP, POLY_ADDRESS, POLY_BUILDER_API_KEY' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass https://gamma-api.polymarket.com/;
            proxy_set_header Host gamma-api.polymarket.com;
            proxy_ssl_server_name on;

            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # ---------------------------------------------------------
        # 2. Polymarket CLOB API Route
        # App Request: http://localhost:8080/clob/...
        # ---------------------------------------------------------
        location /clob/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, POLY_API_KEY, POLY_PASSPHRASE, POLY_SIGNATURE, POLY_TIMESTAMP, POLY_ADDRESS, POLY_BUILDER_API_KEY' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass https://clob.polymarket.com/;
            proxy_set_header Host clob.polymarket.com;
            proxy_ssl_server_name on;

            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # ---------------------------------------------------------
        # 3. CoinGecko API Route 
        # App Request: http://localhost:8080/coingecko/...
        # ---------------------------------------------------------
        location /coingecko/ {
